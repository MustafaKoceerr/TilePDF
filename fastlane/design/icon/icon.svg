<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- The same shapes and coordinates as app/src/main/res/drawable/ic_launcher_*.xml:
       a page with a folded corner whose lower half is a 2x2 grid of tiles, as TilePDF
       renders pages. Everything inside the 66 dp safe zone (21..87). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BE8"/>
      <stop offset="0.55" stop-color="#6650A4"/>
      <stop offset="1" stop-color="#2F2A7A"/>
    </linearGradient>
    <linearGradient id="tileA" x1="38" y1="49" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5FD8"/>
      <stop offset="1" stop-color="#4B3A9A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <path fill="url(#bg)" d="M0,0h108v108h-108z"/>
  <!-- The foreground, scaled to 88% around the centre so the page and its shadow stay in the safe zone. -->
  <g transform="translate(54 54) scale(0.88) translate(-54 -54)">
  <!-- Soft shadow under the page -->
  <path fill="#1A1442" fill-opacity="0.28" d="M36,29h28l12,12v41a4,4 0 0 1 -4,4h-36a4,4 0 0 1 -4,-4v-49a4,4 0 0 1 4,-4z"/>
  <!-- Page -->
  <path fill="#FFFFFF" d="M35,26h28l12,12v41a4,4 0 0 1 -4,4h-36a4,4 0 0 1 -4,-4v-49a4,4 0 0 1 4,-4z"/>
  <!-- Folded corner -->
  <path fill="#D9CFF7" d="M63,26v8a4,4 0 0 0 4,4h8z"/>
  <!-- Text lines -->
  <path fill="#C4B5EE" d="M38.5,36h18a1.5,1.5 0 0 1 0,3h-18a1.5,1.5 0 0 1 0,-3zM38.5,42.5h28a1.5,1.5 0 0 1 0,3h-28a1.5,1.5 0 0 1 0,-3z"/>
  <!-- Tiles -->
  <path fill="url(#tileA)" d="M39,50h11a2,2 0 0 1 2,2v9a2,2 0 0 1 -2,2h-11a2,2 0 0 1 -2,-2v-9a2,2 0 0 1 2,-2zM58,67h11a2,2 0 0 1 2,2v9a2,2 0 0 1 -2,2h-11a2,2 0 0 1 -2,-2v-9a2,2 0 0 1 2,-2z"/>
  <path fill="#B3A2EC" d="M58,50h11a2,2 0 0 1 2,2v9a2,2 0 0 1 -2,2h-11a2,2 0 0 1 -2,-2v-9a2,2 0 0 1 2,-2zM39,67h11a2,2 0 0 1 2,2v9a2,2 0 0 1 -2,2h-11a2,2 0 0 1 -2,-2v-9a2,2 0 0 1 2,-2z"/>
  </g>
</svg>
