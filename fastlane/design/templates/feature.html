<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; src: url({{fonts}}/PlusJakartaSans.ttf); font-weight: 200 800; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: Jakarta, sans-serif; color: #fff; position: relative;
    background: radial-gradient(700px 500px at 15% 0%, rgba(255,255,255,.18), transparent 60%),
                linear-gradient(135deg, #8B6BE8 0%, #6650A4 50%, #2F2A7A 100%);
  }
  .tile { position: absolute; border-radius: 28px; background: rgba(255,255,255,.07); }
  .brand { position: absolute; left: 72px; top: 120px; width: 520px; }
  .row { display: flex; align-items: center; gap: 26px; }
  .row img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 30px rgba(18,10,48,.35); }
  h1 { margin: 0; font-weight: 800; font-size: 78px; letter-spacing: -0.5px; }
  p { margin: 30px 0 0; font-weight: 600; font-size: 34px; line-height: 1.3; color: rgba(255,255,255,.92); }
  .phone {
    position: absolute; right: 70px; top: 46px; width: 300px; height: 673px; padding: 9px; border-radius: 42px;
    background: linear-gradient(145deg, #2b2733, #0d0b12); box-shadow: 0 30px 60px rgba(18,10,48,.5), inset 0 0 0 2px #3b3645;
    transform: rotate(-8deg); transform-origin: 50% 0;
  }
  .phone img { display: block; width: 300px; height: 673px; border-radius: 34px; }
</style>
<body>
  <div class="tile" style="width: 240px; height: 240px; left: -80px; top: 330px;"></div>
  <div class="tile" style="width: 150px; height: 150px; left: 520px; top: -60px;"></div>
  <div class="brand">
    <div class="row"><img src="{{icon}}"><h1>TilePDF</h1></div>
    <p>{{headline}}<br><span style="font-weight: 500; font-size: 26px; color: rgba(255,255,255,.8);">{{subline}}</span></p>
  </div>
  <div class="phone"><img src="{{shot}}"></div>
</body>
</html>
