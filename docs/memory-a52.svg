<title id="t">TilePDF memory on a Samsung Galaxy A52</title>
<desc id="d">Native heap, graphics and Java heap in MB over a 73 second scripted reading session. Memory rises while new pages and zoom levels are rendered, then plateaus: native around 125 MB, graphics around 150 MB, Java heap under 20 MB.</desc>
