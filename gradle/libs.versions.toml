ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }

# Plugins defined by this project (build-logic)
tilepdf-android-application = { id = "tilepdf.android.application" }
tilepdf-android-application-compose = { id = "tilepdf.android.application.compose" }
tilepdf-android-library = { id = "tilepdf.android.library" }
tilepdf-android-library-compose = { id = "tilepdf.android.library.compose" }
tilepdf-android-feature = { id = "tilepdf.android.feature" }
tilepdf-android-room = { id = "tilepdf.android.room" }
tilepdf-hilt = { id = "tilepdf.hilt" }
tilepdf-jvm-library = { id = "tilepdf.jvm.library" }
